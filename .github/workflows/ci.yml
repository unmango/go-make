name: CI

on:
  push:
    # For code coverage reports
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: make build
      - run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: cover.profile

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31.10.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix flake check --all-systems
      - run: nix build

  quickref:
    name: Manual Fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31.10.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Realizes the pinned fetchurl derivations, so a stale hash fails here.
      - run: make sync-quickref

      - name: Fixture is up to date with the manual
        run: git diff --exit-code internal/conformance/testdata/quickref.json
